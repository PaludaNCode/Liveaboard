<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
<!-- A porthole with the waterline across it: the advertised price above, the
     part of the bill that arrives later below. Both colours are the table's
     own (--accent, --later), and the boundary between them is a straight line
     rather than a second wave, because at 16px two crests merge into one
     thick band and the mark loses its point. -->
<style>
.g{fill:#ffffff}.w{fill:#0d5c8c}.d{fill:#a44d0e}.r{stroke:#0d5c8c}
@media(prefers-color-scheme:dark){.g{fill:#131a23}.w{fill:#63b3e3}.d{fill:#e8a86a}.r{stroke:#63b3e3}}
</style>
<defs><clipPath id="p"><circle cx="16" cy="16" r="11.4"/></clipPath></defs>
<circle class="g" cx="16" cy="16" r="11.4"/>
<g clip-path="url(#p)">
<path class="w" d="M2 15.4q3.5-3.2 7 0t7 0 7 0 7 0V30H2Z"/>
<path class="d" d="M2 22.6h28V30H2Z"/>
</g>
<circle class="r" cx="16" cy="16" r="13" fill="none" stroke-width="3.4"/>
</svg>
