<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    .lb {
      --ground:#f7f8fa; --panel:#ffffff; --rule:#dde3ec; --rule-strong:#c3ccd9;
      --ink:#141a22; --ink-dim:#5b6675; --ink-faint:#66707c;
      --accent:#0d5c8c; --accent-soft:#e4eef6;
      --later:#a44d0e; --later-soft:#fbeee2;
      --ok:#1f6b45; --warn:#855f0f; --unknown:#5c6570; --sold:#9c3535;
      --bill:#f2f7fb; --bill-edge:#cfdeeb;
      --font-sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto,
                  "Helvetica Neue", Arial, sans-serif;
      --font-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo,
                  Consolas, "Liberation Mono", monospace;
      --font-narrow:"IBM Plex Sans Condensed", "Avenir Next Condensed",
                    "Roboto Condensed", "Liberation Sans Narrow", "Arial Narrow",
                    var(--font-sans);
    }
    .lb.dark {
      --ground:#0d1219; --panel:#131a23; --rule:#232d3a; --rule-strong:#334154;
      --ink:#e6ecf3; --ink-dim:#9aa7b7; --ink-faint:#8d99a8;
      --accent:#63b3e3; --accent-soft:#152a3a;
      --later:#e8a86a; --later-soft:#2e2015;
      --ok:#6cc394; --warn:#d6ad55; --unknown:#939db0; --sold:#e08379;
      --bill:#161f2a; --bill-edge:#2b3949;
    }
    body { margin:0; font-family:var(--font-sans); }
    a { color:#0d5c8c; text-decoration:none; }
    a:hover { color:#0a4a70; }
    * { box-sizing:border-box; }
  </style>
</helmet>

<!-- The phone view. Not the desktop table with columns folded away: at 390
     the sixteen-column row could only ever keep the Total on screen by
     hiding the boat behind it, and which columns went was a typed
     breakpoint that went stale the moment the Total column got wider (#150).
     A card has no columns to fold — the money sits in its own corner at every
     width, and nothing has to be measured to keep it there. -->
<div class="lb {{themeCls}}" style="display:flex; flex-direction:column; width:{{W}}px; height:{{H}}px; background:var(--ground); color:var(--ink); font-size:13px; line-height:1.45; overflow:hidden; -webkit-font-smoothing:antialiased">

  <div style="flex:none; padding:10px 14px 9px; background:var(--panel); border-bottom:1px solid var(--rule)">
    <div style="display:flex; align-items:baseline; gap:8px">
      <div style="font-family:var(--font-narrow); font-size:16px; font-weight:600">Egypt liveaboards</div>
      <div style="font-size:11px; color:var(--ink-faint)">May–Aug 2027</div>
      <div style="margin-left:auto; font-family:var(--font-mono); font-size:12px; font-variant-numeric:tabular-nums; color:var(--ink-dim)">{{shown}}</div>
    </div>
  </div>

  <!-- Two controls, both 44px tall. Everything else is behind Filters. -->
  <div style="flex:none; display:flex; gap:8px; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--rule)">
    <button type="button" onClick="{{toggleDrawer}}" style="{{drawerBtnStyle}}">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4h12M4.5 8h7M6.5 12h3"/></svg>
      Filters
      <sc-if value="{{anyFilter}}" hint-placeholder-val="{{true}}">
        <span style="font-family:var(--font-mono); font-size:10px; background:var(--accent); color:#fff; border-radius:8px; padding:0 5px; line-height:15px">{{nFilters}}</span>
      </sc-if>
    </button>
    <button type="button" onClick="{{cycleSort}}" style="{{sortBtnStyle}}">
      <span style="font-size:9.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint)">Sort</span>
      {{sortLabel}}
      <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4l4 4 4-4"/></svg>
    </button>
  </div>

  <!-- The filter sheet. One panel, scrolled inside itself, so a bank never
       pushes another off the bottom edge the page cannot scroll to. -->
  <sc-if value="{{drawer}}" hint-placeholder-val="{{true}}">
    <div style="flex:1 1 auto; min-height:0; display:flex; flex-direction:column; background:var(--panel); border-bottom:1px solid var(--rule-strong)">
      <div style="flex:1 1 auto; overflow-y:auto; padding:12px 14px 16px">
        <sc-for list="{{sheet}}" as="b" hint-placeholder-count="4">
          <div style="margin-bottom:15px">
            <div style="display:flex; align-items:baseline; gap:8px; margin-bottom:7px">
              <span style="font-family:var(--font-narrow); font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-dim)">{{b.title}}</span>
              <span style="{{b.badgeStyle}}">{{b.badge}}</span>
            </div>
            <div style="display:flex; flex-wrap:wrap; gap:6px">
              <sc-for list="{{b.chips}}" as="c" hint-placeholder-count="6">
                <button type="button" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}} <span style="{{c.countStyle}}">{{c.count}}</span></button>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="flex:none; display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--rule)">
        <button type="button" onClick="{{clearAll}}" style="flex:none; font:inherit; font-size:13px; min-height:44px; padding:0 16px; border:1px solid var(--rule-strong); background:transparent; color:var(--ink-dim); border-radius:2px; cursor:pointer">Clear all</button>
        <button type="button" onClick="{{toggleDrawer}}" style="flex:1 1 auto; font:inherit; font-size:13px; font-weight:500; min-height:44px; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:2px; cursor:pointer">Show {{shown}} trips</button>
      </div>
    </div>
  </sc-if>

  <!-- The cards -->
  <sc-if value="{{listing}}" hint-placeholder-val="{{true}}">
    <div style="flex:1 1 auto; overflow-y:auto; min-height:0; padding:8px 10px 16px; display:flex; flex-direction:column; gap:7px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
        <div style="background:var(--panel); border:1px solid var(--rule); border-radius:3px; padding:9px 11px 8px; display:flex; flex-direction:column; gap:4px">

          <div style="display:flex; align-items:flex-start; gap:10px">
            <div style="flex:1 1 auto; min-width:0">
              <div style="font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">{{r.boat}}</div>
              <div style="font-family:var(--font-mono); font-size:11.5px; color:var(--ink-dim); font-variant-numeric:tabular-nums">{{r.dates}} <span style="font-family:var(--font-sans); color:var(--ink-faint)">· {{r.nights}}</span></div>
            </div>
            <!-- The money, in its own corner. Nothing folds it away. -->
            <div style="flex:none; text-align:right; background:var(--bill); border:1px solid var(--bill-edge); border-radius:2px; padding:3px 7px 4px; margin:-2px -3px 0 0">
              <div style="font-family:var(--font-mono); font-size:15px; font-weight:600; letter-spacing:-.01em; color:var(--accent); font-variant-numeric:tabular-nums; white-space:nowrap">{{r.total}}</div>
              <div style="font-family:var(--font-mono); font-size:9.5px; color:var(--ink-faint); font-variant-numeric:tabular-nums; white-space:nowrap">{{r.split}}<sc-if value="{{r.tips}}" hint-placeholder-val="{{true}}"><span style="font-family:var(--font-sans)"> + tips</span></sc-if></div>
            </div>
          </div>

          <div style="font-size:12.5px; color:var(--ink); line-height:1.35">{{r.trip}}</div>
          <div style="font-size:11px; color:var(--ink-faint); line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">{{r.route}} &nbsp;·&nbsp; {{r.sites}}</div>

          <div style="display:flex; align-items:center; flex-wrap:wrap; gap:5px 8px; margin-top:2px; padding-top:6px; border-top:1px solid var(--rule)">
            <sc-if value="{{r.hasSale}}" hint-placeholder-val="{{true}}">
              <span style="font-family:var(--font-mono); font-size:10.5px; font-weight:600; color:var(--later); background:var(--later-soft); border-radius:2px; padding:1px 5px">{{r.sale}}</span>
            </sc-if>
            <span style="{{r.placeNumStyle}}">{{r.placeNum}}</span>
            <span style="font-size:10.5px; color:var(--ink-faint)">{{r.placeWord}}</span>
            <span style="font-family:var(--font-mono); font-size:10.5px; color:var(--ink-dim)">{{r.entry}}</span>
            <span style="font-size:10.5px; color:var(--ink-faint)">nitrox {{r.nitrox}}</span>
            <span style="margin-left:auto; display:flex; gap:8px">
              <sc-if value="{{r.lav}}" hint-placeholder-val="{{true}}">
                <a href="#" style="font-size:11px; color:var(--accent); white-space:nowrap">liveaboard ↗</a>
              </sc-if>
              <sc-if value="{{r.padi}}" hint-placeholder-val="{{true}}">
                <a href="#" style="font-size:11px; color:var(--accent); white-space:nowrap">PADI ↗</a>
              </sc-if>
            </span>
          </div>
        </div>
      </sc-for>
      <div style="padding:10px 4px 4px; text-align:center; font-size:11px; color:var(--ink-faint)">{{tailNote}}</div>
    </div>
  </sc-if>
</div>
</x-dc>

<script data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Display"},"$preview":{"width":390,"height":844}}'>
/* Shared helpers for the trips-overview artboards.
   build.py splices this into each .dc.html ahead of the Component class.
   Plain classic JS: Design Components take no import/export. */

/* The four Include-switch readings, in the order build.py packs them. Each
   row carries all four as they were read off the live page rather than
   arithmetic done here: nitrox and gear normalise per basis in pricing.py,
   and a prototype re-deriving them would be inventing a price. */
var VARIANT = { "1,1": 0, "0,1": 1, "0,0": 2, "1,0": 3 };

/* Chip label against the value the rows carry. The season is four months, so
   the pair is written out rather than derived. */
var MONTHS = [["May", "May"], ["Jun", "June"], ["Jul", "July"], ["Aug", "August"]];
var SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
             "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

/* Least demanding first, which is not the order the counts give. The reader
   goes down this bank looking for the last bar they still clear, so it is a
   ladder rather than a list of popular options. */
var BAR_ORDER = ["OW", "OW + 5", "OW + 10", "OW + 15", "OW + 20", "OW + 25",
                 "OW + 30", "OW + 40", "ADV", "ADV + 10", "ADV + 15",
                 "ADV + 20", "ADV + 25", "ADV + 30", "ADV + 35", "ADV + 40",
                 "ADV + 50"];

var COLS = [
  { k: "start",   t: "Dates",          w: 112, zone: "trip",
    title: "Departure and return, and the nights between" },
  { k: "boat",    t: "Boat",           w: 138, zone: "trip",
    title: "The vessel, and how many guests it sleeps" },
  { k: "trip",    t: "Trip",           w: 170, zone: "trip",
    title: "The itinerary as its operator names it, and the harbours" },
  { k: "sites",   t: "Dive sites",     w: 128, zone: "trip",
    title: "Reefs read from the operator’s own description of the trip" },
  { k: "entry",   t: "Entry bar",      w: 74,  short: "Entry",  zone: "trip",
    title: "Certification and logged dives the operator requires" },
  { k: "base",    t: "Advertised",     w: 104, zone: "bill", num: true,
    title: "The berth price the seller leads with" },
  { k: "nitrox",  t: "Nitrox",         w: 66,  zone: "bill", num: true,
    title: "What breathing gas costs on this boat, or that it is bundled" },
  { k: "fees",    t: "Mandatory fees", w: 104, short: "Mandatory", zone: "bill", num: true,
    title: "Everything charged on top that you cannot decline" },
  { k: "total",   t: "Total",          w: 158, zone: "bill", num: true,
    title: "The cheapest whole bill any seller quotes for this sailing" },
  { k: "perdive", t: "Per dive",       w: 78,  zone: "bill", num: true,
    title: "Total over the fewest dives the operator states — a ceiling" },
  { k: "places",  t: "Places",         w: 80,  zone: "seats", num: true,
    title: "The seller’s claim on its booking page, true when it was read" },
  { k: "seller",  t: "Seller",         w: 78,  zone: "seats",
    title: "Who lists this sailing" }
];

var GRID = COLS.map(function (c) { return c.w + "px"; }).join(" ");

var GROUPS = [
  { label: "The trip",     span: 5, zone: "trip" },
  { label: "The bill",     span: 5, zone: "bill" },
  { label: "Availability", span: 2, zone: "seats" }
];

var BANKS = [
  { k: "ports",  label: "Departs from", title: "Departs from",
    note: "the harbour the trip leaves from" },
  { k: "sites",  label: "Dive sites",   title: "Dive sites",
    note: "read from the operator’s own description, never its region list" },
  { k: "boats",  label: "Boat",         title: "Boat",
    note: "everything one vessel runs across the season" },
  { k: "bars",   label: "Entry bar",    title: "Entry bar",
    note: "least demanding first — certification and logged dives together" },
  { k: "sellers", label: "Sold by",     title: "Sold by",
    note: "both sites list it, or only one of them does" },
  { k: "nights", label: "Nights",       title: "Trip length",
    note: "" }
];

function eur(n) { return "€" + Math.round(n).toLocaleString("en-IE"); }

function eurRange(lo, hi) {
  if (lo == null) return "—";
  return Math.round(lo) === Math.round(hi)
    ? eur(lo)
    : eur(lo) + "–" + Math.round(hi).toLocaleString("en-IE");
}

function dayOf(iso) { return ("0" + Number(iso.slice(3, 5))).slice(-2); }
function monOf(iso) { return SHORT[Number(iso.slice(0, 2)) - 1]; }

/* "01–08 May", and the long form only where the trip crosses a month. */
function dateSpan(start, end) {
  return monOf(start) === monOf(end)
    ? dayOf(start) + "–" + dayOf(end) + " " + monOf(start)
    : dayOf(start) + " " + monOf(start) + " – " + dayOf(end) + " " + monOf(end);
}

function initialState(drawerOpen, bank) {
  return {
    sort: "start", dir: 1,
    months: [], sellers: [], ports: [], sites: [], boats: [], bars: [],
    onSale: false, hideSold: false,
    nitroxOn: true, gearOn: true,
    nmin: null, nmax: null,
    drawer: !!drawerOpen,
    bank: bank || "ports"
  };
}

/* ------------------------------------------------------------------ */
/* Filtering: OR inside a bank, AND across banks, which is what the chips on
   the live page do. */

function passes(r, s) {
  if (s.months.length && s.months.indexOf(monOf(r.start)) < 0) return false;
  if (s.ports.length && s.ports.indexOf(r.from) < 0) return false;
  if (s.boats.length && s.boats.indexOf(r.boat) < 0) return false;
  if (s.bars.length && s.bars.indexOf(r.entry) < 0) return false;
  if (s.sites.length) {
    var hit = false;
    for (var i = 0; i < s.sites.length; i++) {
      if (r.sites.indexOf(s.sites[i]) >= 0) { hit = true; break; }
    }
    if (!hit) return false;
  }
  if (s.sellers.length && s.sellers.indexOf(sellerCase(r)) < 0) return false;
  if (s.onSale && !r.sale) return false;
  if (s.hideSold && (r.places.kind === "soldout" || r.places.n === 0)) return false;
  if (s.nmin != null && r.nights < s.nmin) return false;
  if (s.nmax != null && r.nights > s.nmax) return false;
  return true;
}

/* Three cases because there are three, and both sellers are named: "here"
   asked the reader to work out which of the two sites this page is. */
function sellerCase(r) {
  if (r.sellers.length === 2) return "Both";
  return r.sellers[0] === "padi.com" ? "PADI only" : "liveaboard.com only";
}

function pad(n) { return ("00000" + (Math.round(Number(n)) + 100000)).slice(-6); }

function sortVal(r, k, v) {
  switch (k) {
    case "start": return r.start;
    case "boat": return r.boat.toLowerCase();
    case "trip": return r.trip.toLowerCase();
    case "sites": return (r.sites[0] || "zzz").toLowerCase();
    case "entry": return pad(BAR_ORDER.indexOf(r.entry));
    case "base": return pad(r.baseLo);
    case "nitrox": return pad(r.nitrox == null ? -1 : r.nitrox);
    case "fees": return pad(r.v[v][0]);
    case "total": return pad(r.v[v][2]);
    case "perdive": return pad(r.perdive == null ? 99999 : r.perdive);
    case "places": return pad(r.places.n == null ? -1 : r.places.n);
    case "seller": return sellerCase(r);
  }
  return "";
}

/* ------------------------------------------------------------------ */
/* Display. A {{hole}} is a dotted lookup, so every string and every style
   the markup prints is finished here. */

var MONO = "font-family:var(--font-mono); font-variant-numeric:tabular-nums;";

function decorate(r, v, nitroxOn) {
  var vv = r.v[v];
  var feeLo = vv[0], feeHi = vv[1], totLo = vv[2], totHi = vv[3];
  var p = r.places, num, word, color, weight;
  if (p.kind === "soldout") {
    num = "sold out"; word = ""; color = "var(--sold)"; weight = "600";
  } else if (p.kind === "word") {
    num = p.word; word = "operator’s word"; color = "var(--unknown)"; weight = "400";
  } else {
    num = String(p.n);
    word = p.kind === "aboard" ? "aboard" : "at this price";
    color = p.n === 0 ? "var(--warn)" : "var(--ink)";
    weight = p.n === 0 ? "600" : "500";
  }
  var placeStyle = p.kind === "soldout" || p.kind === "word"
    ? "font-size:11px; font-weight:" + weight + "; color:" + color + "; white-space:nowrap"
    : MONO + " font-size:12.5px; font-weight:" + weight + "; color:" + color + "; white-space:nowrap";

  return {
    dates: dateSpan(r.start, r.end),
    nights: r.nights + " nights",
    boat: r.boat,
    pax: r.guests == null ? "guests not stated" : r.guests + " guests",
    trip: r.trip,
    route: r.from === r.to ? r.from + " · return" : r.from + " → " + r.to,
    sites: r.sites.length ? r.sites.join(" · ") : "not named",
    sitesFull: r.sites.length ? r.sites.join(", ") : "The operator names no reef",
    entry: r.entry,
    entryTwo: !!r.entryTwo,
    base: eurRange(r.baseLo, r.baseHi),
    sale: r.sale ? "−" + r.sale + "%" : "",
    hasSale: !!r.sale,
    saleTitle: r.sale
      ? "Down from " + eur(r.saleFrom) + ", per " +
        (r.saleWho === "both" ? "liveaboard.com and padi.com" : r.saleWho) +
        " — read 31 Aug, and a markdown can end overnight"
      : "",
    nitrox: r.nitrox == null ? "included" : eur(r.nitrox),
    nitroxStyle: r.nitrox == null
      ? "font-size:11px; color:var(--ok); white-space:nowrap"
      : (nitroxOn
          ? MONO + " font-size:12px; white-space:nowrap"
          : MONO + " font-size:12px; color:var(--ink-faint); text-decoration:line-through; white-space:nowrap"),
    fees: "+" + eurRange(feeLo, feeHi),
    total: eurRange(totLo, totHi),
    split: eur(r.baseLo) + " + " + eurRange(feeLo, feeHi),
    tips: !!r.tips,
    varies: !!r.varies,
    perdive: r.perdive == null ? "—" : eur(r.perdive),
    dives: r.dives == null ? "not stated" : r.dives + "+ dives",
    placeNum: num,
    placeWord: word,
    placeNumStyle: placeStyle,
    lav: r.sellers.indexOf("liveaboard.com") >= 0,
    padi: r.sellers.indexOf("padi.com") >= 0
  };
}

/* ------------------------------------------------------------------ */
/* Chips. One vocabulary for every bank, so a pressed chip looks the same
   wherever it sits. */

var CHIP = "font:inherit; font-size:11.5px; cursor:pointer; padding:3px 9px; " +
           "border:1px solid var(--rule-strong); background:transparent; " +
           "color:var(--ink-dim); border-radius:2px; white-space:nowrap; " +
           "display:inline-flex; align-items:center; gap:5px";
var CHIP_ON = "font:inherit; font-size:11.5px; cursor:pointer; padding:3px 9px; " +
              "border:1px solid var(--accent); background:var(--accent-soft); " +
              "color:var(--accent); font-weight:500; border-radius:2px; " +
              "white-space:nowrap; display:inline-flex; align-items:center; gap:5px";

function chipStyle(on) { return on ? CHIP_ON : CHIP; }
function countStyle(on) {
  return MONO + " font-size:9.5px; color:" +
    (on ? "var(--accent)" : "var(--ink-faint)") + "; opacity:.85";
}

/* A switch, not a filter: it changes what every total in the table means,
   so it reads as on/off rather than as one more chip. */
function switchStyle(on) {
  return "font:inherit; font-size:11.5px; cursor:pointer; padding:3px 9px 3px 7px; " +
    "border-radius:2px; display:inline-flex; align-items:center; gap:6px; " +
    (on ? "border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:500"
        : "border:1px solid var(--rule-strong); background:transparent; color:var(--ink-faint)");
}
function dotStyle(on) {
  return "width:7px; height:7px; border-radius:50%; background:" +
    (on ? "var(--accent)" : "var(--rule-strong)");
}

/* Phone chrome. 44px minimum on anything a thumb has to hit — the page is
   built to work on a phone in a dive shop, where hover does not exist. */
function touchChip(on) {
  return "font:inherit; font-size:12.5px; cursor:pointer; min-height:34px; " +
    "padding:6px 12px; border-radius:2px; display:inline-flex; align-items:center; " +
    "gap:6px; white-space:nowrap; " +
    (on ? "border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:500"
        : "border:1px solid var(--rule-strong); background:transparent; color:var(--ink-dim)");
}
function touchButton(on) {
  return "font:inherit; font-size:13px; cursor:pointer; min-height:44px; " +
    "padding:0 14px; border-radius:2px; display:inline-flex; align-items:center; " +
    "gap:7px; " +
    (on ? "border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:500"
        : "border:1px solid var(--rule-strong); background:var(--panel); color:var(--ink-dim)");

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = initialState(false, "ports");
  }

  flip(bank, value) {
    var next = (this.state[bank] || []).slice();
    var at = next.indexOf(value);
    if (at < 0) next.push(value); else next.splice(at, 1);
    var patch = {}; patch[bank] = next;
    this.setState(patch);
  }

  facetChips(bank, list, cap) {
    var self = this;
    var on = this.state[bank] || [];
    return list.slice(0, cap).map(function (e) {
      var live = on.indexOf(e[0]) >= 0;
      return {
        label: e[0], count: e[1].toLocaleString("en-IE"),
        style: touchChip(live), countStyle: countStyle(live),
        pick: function () { self.flip(bank, e[0]); }
      };
    });
  }

  renderVals() {
    var self = this;
    var s = this.state;
    var v = VARIANT[(s.nitroxOn ? 1 : 0) + "," + (s.gearOn ? 1 : 0)];

    var kept = ROWS.filter(function (r) { return passes(r, s); });
    kept.sort(function (a, b) {
      var x = sortVal(a, s.sort, v), y = sortVal(b, s.sort, v);
      if (x < y) return -s.dir;
      if (x > y) return s.dir;
      return a.start < b.start ? -1 : 1;
    });

    /* Three orders, not twelve headers: a phone has no header row to press,
       and these are the three questions a diver on a dock actually asks. */
    var ORDERS = [
      { k: "start", dir: 1, label: "soonest" },
      { k: "total", dir: 1, label: "cheapest" },
      { k: "perdive", dir: 1, label: "per dive" }
    ];
    var at = 0;
    for (var i = 0; i < ORDERS.length; i++) if (ORDERS[i].k === s.sort) at = i;

    var pills = 0;
    ["months", "ports", "sites", "boats", "bars", "sellers"].forEach(function (b) {
      pills += (s[b] || []).length;
    });
    if (s.onSale) pills++;
    if (s.hideSold) pills++;

    var sheet = [
      { title: "Month", key: "months",
        chips: MONTHS.map(function (m) {
          var live = s.months.indexOf(m[0]) >= 0;
          return { label: m[1], count: (MONTH_COUNTS[m[0]] || 0).toLocaleString("en-IE"),
                   style: touchChip(live), countStyle: countStyle(live),
                   pick: function () { self.flip("months", m[0]); } };
        }) },
      { title: "Departs from", key: "ports", chips: this.facetChips("ports", FACETS.ports, 8) },
      { title: "Dive sites", key: "sites", chips: this.facetChips("sites", FACETS.sites, 12) },
      { title: "Entry bar", key: "bars", chips: this.facetChips("bars", FACETS.bars, 17) },
      { title: "Sold by", key: "sellers", chips: this.facetChips("sellers", FACETS.sellers, 3) }
    ].map(function (b) {
      var n = (s[b.key] || []).length;
      return {
        title: b.title, chips: b.chips, badge: n ? String(n) : "",
        badgeStyle: n
          ? "font-family:var(--font-mono); font-size:9.5px; background:var(--accent); color:#fff; border-radius:8px; padding:0 5px; line-height:15px"
          : "display:none"
      };
    });

    return {
      W: W, H: H,
      themeCls: (this.props.theme || "light") === "dark" ? "dark" : "",
      shown: kept.length.toLocaleString("en-IE"),
      rows: kept.slice(0, 40).map(function (r) { return decorate(r, v, s.nitroxOn); }),
      tailNote: kept.length
        ? "The live page pages the rest in as you scroll."
        : "Nothing matches. Drop a filter.",

      drawer: s.drawer,
      listing: !s.drawer,
      toggleDrawer: function () { self.setState({ drawer: !s.drawer }); },
      drawerBtnStyle: touchButton(s.drawer || pills > 0),
      anyFilter: pills > 0,
      nFilters: String(pills),
      clearAll: function () {
        self.setState({ months: [], sellers: [], ports: [], sites: [], boats: [],
                        bars: [], onSale: false, hideSold: false, nmin: null, nmax: null });
      },
      sheet: sheet,

      sortLabel: ORDERS[at].label,
      sortBtnStyle: touchButton(false),
      cycleSort: function () {
        var next = ORDERS[(at + 1) % ORDERS.length];
        self.setState({ sort: next.k, dir: next.dir });
      }
    };
  }
