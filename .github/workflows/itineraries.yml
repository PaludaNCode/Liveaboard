name: Read trip itineraries

# Fetch the per-trip itinerary fragment and commit the book, on demand.
#
# Separate from the daily refresh, which also runs this, for one reason: it
# needs no crawl. Both ids in the URL come out of the committed
# `data/archive.json`, so this asks liveaboard.com for nothing but the
# fragments themselves — where a capped run through refresh.yml would scrape
# 320 vessel pages first to test three requests, which is worse for the source
# than the thing being tested.
#
# So this is how a change to `scrape/itinerary.py` gets proved: run it with
# `limit: 3`, read what came back, then take the cap off. A capped run merges
# into the book rather than replacing it — it knows nothing about the trips it
# did not visit — exactly as `scrape_fees.py --limit` does.

on:
  # Daily, inherited from the refresh that used to carry it (#123). It stays
  # cheap: the book is incremental, so a trip already in it is never re-read
  # and an ordinary run is a handful of requests. It ran as a step gated on the
  # crawl succeeding, which was the wrong coupling — a trip's own description
  # does not depend on whether the vessel-page crawl finished.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Cap trip fragments fetched (0 = every trip not yet read)"
        type: string
        default: "3"
      refresh:
        description: "Re-fetch trips already in the book, rather than only new ones"
        type: boolean
        default: false
      boat:
        description: "Restrict discovery to one vessel slug (for proving a change)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  # Never beside itself or the daily refresh: both write data/itineraries.json
  # and push it, and two jobs doing that is a guaranteed conflict.
  group: itineraries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only the tests that answer to `src/`. The ones that assert against
      # committed data are a **publication** gate and are deliberately not run
      # here — see tests/published.py. Running them in front of a fetch is how
      # cabins.yml deadlocked on 2026-08-30: a stale cabin book contradicted
      # the rows the refresh had just written, the suite failed on that, and
      # the only job able to refresh the book exited before its fetch step.
      #
      # A run that fetches and then refuses to publish is recoverable. One
      # that refuses to fetch is not.
      - name: Run the code's own tests
        run: LIVEABOARD_TESTS=code PYTHONPATH=src python3 -m unittest discover -s tests

      # The run summary is where a capped run is actually read: it prints the
      # reefs and dive count found per trip, any region the site recogniser
      # does not know, and — every run, fetch or not — how many published
      # itineraries still have no fragment at all.
      #
      # `--discover` is on because the archive cannot reach every trip. Its
      # tour ids come from `Event` nodes, so a vessel liveaboard.com sells no
      # in-season berth on contributes none however often this runs, and 85
      # published itineraries were unreachable by construction. The ids are on
      # the vessel page; this opens one page per boat still short of a
      # fragment, which is fifteen requests rather than one per hull.
      - name: Read what each trip says about itself
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/fetch_itineraries.py \
            --archive data/archive.json \
            --out data/itineraries.json \
            --snapshots data/snapshots \
            --dataset data/egypt-2027.json \
            --fees data/fees.json \
            --limit "${{ inputs.limit || 3 }}" \
            --discover \
            ${{ inputs.boat && format('--boat {0}', inputs.boat) || '' }} \
            ${{ inputs.refresh && '--refresh' || '' }} \
            | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Keep the fragments themselves, so a parse that silently found nothing
      # can be diagnosed from what the source actually returned rather than by
      # asking it again.
      - name: Keep the raw fragments as evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itinerary-snapshots-${{ github.run_id }}
          path: data/snapshots/
          retention-days: 14
          if-no-files-found: ignore

      # Hand over the reading, never the dataset built from it. `publish.yml`
      # rebuilds both from the branch tip, so a derived file cannot arrive
      # stale -- see the note at the top of that file.
      - uses: actions/upload-artifact@v4
        with:
          name: itineraries-inputs-${{ github.run_id }}
          path: |
            data/itineraries.json
          retention-days: 1

  # Promotion is offline and takes seconds; the fetch above took minutes. A run
  # that writes its book and stops leaves the committed dataset disagreeing
  # with its own inputs -- a red build, and before that a page one pass behind
  # its own data. Serialised, so two sources cannot each derive from a tree the
  # other has already moved: see .github/workflows/publish.yml.
  publish:
    needs: fetch
    uses: ./.github/workflows/publish.yml
    with:
      carry: itineraries-inputs-${{ github.run_id }}
      subject: "data: read {today} trip itineraries"
      nothing: "no new trips read; nothing to commit"
