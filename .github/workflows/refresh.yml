name: Daily refresh

# Re-scrape the source sites, rebuild the site, and commit the result.
#
# This runs on GitHub's runners, which have ordinary internet access — so the
# scrape works here even when a development sandbox is behind a restrictive
# egress allowlist and cannot reach the sources at all.
#
# The scrape writes a *candidate* file. Promoting a candidate into the live
# dataset is a separate, reviewable step, so a source site changing its markup
# degrades into "yesterday's prices plus a warning" rather than a site full of
# blanks.

on:
  schedule:
    # 04:15 UTC daily — outside European browsing hours, and after operators
    # have typically published overnight availability changes.
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Cap vessels crawled (0 = the adapter default)"
        type: string
        default: "0"
      itinerary_limit:
        description: "Cap trip fragments fetched (0 = every trip not yet read)"
        type: string
        default: "0"
      force_promote:
        description: "Publish even if the dataset shrinks sharply"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests

      # Every advertised price is quoted in dollars and the site shows euro,
      # so this one number sits under every figure on the page. Runs before the
      # scrape so a slow crawl cannot push it past the ECB's publication.
      #
      # continue-on-error because a missed rate is not worth losing a whole
      # refresh over: the tool keeps the previous file, which still records the
      # day it was quoted, and the page says when a rate has stopped moving.
      - name: Refresh exchange rates
        continue-on-error: true
        run: python3 tools/fetch_fx.py --out data/fx.json

      # padi.com is parked: both its entry paths 404 and it contributes
      # requirements, not prices. Scraping only what works keeps a failing
      # source from muddying a good run.
      - name: Scrape liveaboard.com
        id: scrape
        continue-on-error: true
        run: |
          PYTHONPATH=src python3 -m liveaboard.cli scrape \
            --source liveaboard.com \
            --max-pages "${{ inputs.max_pages || 0 }}" \
            --out data/candidate.json \
            --snapshots data/snapshots

      # What each trip says about itself: the reefs it visits, its dive count,
      # its group size and its entry bar. A separate endpoint from the vessel
      # page, and the only per-*trip* source there is — everything else here
      # describes the boat's year, which is why "Simply the Best" had no reefs
      # and a St John's week once carried a badge for a reef 600 km away.
      #
      # After the scrape because it reads the tour ids out of the archive that
      # scrape just wrote, and before the promote that consumes its output.
      #
      # Incremental by design: a trip's reefs do not change from night to
      # night, so only genuinely new trips are fetched. The first run is about
      # 314 requests at the fetcher's usual delay; every run after it is a
      # handful, which is what makes this affordable to do daily at all.
      #
      # `itinerary_limit` caps a dispatched run. A capped run *merges* into the
      # book rather than replacing it — it knows nothing about the trips it did
      # not visit — which is what makes it safe to prove a new parser against
      # three real trips before pointing it at three hundred of somebody
      # else's pages. The same rule as `scrape_fees.py --limit`.
      - name: Read what each trip says about itself
        if: steps.scrape.outcome == 'success'
        continue-on-error: true
        run: |
          python3 tools/fetch_itineraries.py \
            --archive data/archive.json \
            --out data/itineraries.json \
            --snapshots data/snapshots \
            --limit "${{ inputs.itinerary_limit || 0 }}"

      # What the other seller is discounting, for the season this site
      # publishes.
      #
      # One or two requests. `/liveaboard-deals/` is an AngularJS shell whose
      # bundle is CDN-hosted, but the XHR behind it takes that page's own
      # `country` and `date` parameters over plain HTTP and pages properly, so
      # this needs no browser and no runner-only step.
      #
      # Unconditional, because it is a different source from the scrape above
      # and a failed crawl says nothing about it. Immediately before the
      # promote, because `data/deals.json` is a promote input: one commit
      # should carry the new reading *and* the dataset built from it, or
      # `promote --check` goes red until promote.yml heals it on the next push.
      #
      # A committed file rather than an artifact, and that is the whole design:
      # a change log is a diff between two committed days. Re-reading recovers
      # today's deals and never yesterday's, so a log computed from something
      # that ages out becomes "no changes" a fortnight later without saying so.
      #
      # A same-day re-run fetches nothing at all -- not one request whose answer
      # would be discarded.
      - name: Read what PADI is discounting
        continue-on-error: true
        run: python3 tools/fetch_deals.py --out data/deals.json

      - name: Promote the candidate
        id: promote
        if: steps.scrape.outcome == 'success'
        continue-on-error: true
        run: |
          PYTHONPATH=src python3 -m liveaboard.cli promote \
            --candidate data/candidate.json \
            --out data/egypt-2027.json \
            ${{ inputs.force_promote && '--force' || '' }}

      - name: Report a blocked or empty scrape
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::warning::Scrape did not complete. The site will rebuild from the"
          echo "::warning::last good dataset. Download the snapshots artifact to see"
          echo "::warning::what the source sites actually returned."

      - name: Keep the raw pages as evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ github.run_id }}
          path: data/snapshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Pick the dataset to publish
        id: dataset
        run: |
          # Prefer promoted, scraped data; fall back to the seed so a failed
          # scrape publishes yesterday's site rather than nothing.
          if [ -f data/egypt-2027.json ]; then
            echo "path=data/egypt-2027.json" >> "$GITHUB_OUTPUT"
          else
            echo "path=data/seed/egypt-2027.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the dataset
        run: PYTHONPATH=src python3 -m liveaboard.cli check --data ${{ steps.dataset.outputs.path }}

      - name: Build the site
        run: PYTHONPATH=src python3 -m liveaboard.cli build --data ${{ steps.dataset.outputs.path }}

      # Before the commit, while HEAD is still yesterday's dataset. Afterwards
      # the comparison would be against the run's own output.
      #
      # Three destinations, because a run summary is gone once the run ages
      # out: the summary for whoever opens the run, data/CHANGES.md for the
      # durable history, and one line captured for the commit subject so
      # `git log --oneline data/` reads as the changelog it always was.
      - name: Report what changed
        id: changed
        run: |
          PYTHONPATH=src python3 -m liveaboard.cli changes \
            --data ${{ steps.dataset.outputs.path }} \
            --revision HEAD \
            --append data/CHANGES.md \
            >> "$GITHUB_STEP_SUMMARY"
          headline=$(PYTHONPATH=src python3 -m liveaboard.cli changes \
            --data ${{ steps.dataset.outputs.path }} --revision HEAD --headline)
          echo "headline=${headline}" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        # Through the environment, not `${{ }}`: the headline carries boat
        # names that came off somebody else's web page, and interpolating
        # those straight into a shell line is how a scraped string becomes a
        # command.
        env:
          HEADLINE: ${{ steps.changed.outputs.headline }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data site
          if git diff --cached --quiet; then
            echo "nothing changed today"
            exit 0
          fi
          # Every run is a commit, so the git history doubles as price history:
          # `git log -p data/` shows exactly which fee moved, and when — and
          # the subject says which, so finding it does not mean opening 2 MB.
          git commit -m "data: daily refresh $(date -u +%Y-%m-%d) — ${HEADLINE}"

          # A scrape takes minutes, and anything can land meanwhile -- the
          # other scheduled job, or a merge. A plain push is rejected and the
          # whole run's data is thrown away. Rebase and retry instead.
          # -X theirs favours the commit being replayed, which is ours: these
          # files are regenerated output, so the fresh copy always wins.
          #
          # Rebase onto the branch this run is actually on. It used to rebase
          # onto origin/main unconditionally, which is a no-op on any other
          # branch -- so a run dispatched against a feature branch retried
          # three times against the wrong ref and threw the scrape away.
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${branch}"; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/${branch}"
            git fetch origin "$branch"
            git rebase -X theirs FETCH_HEAD || { git rebase --abort; exit 1; }
          done
          echo "::error::could not push after 3 attempts"
          exit 1
