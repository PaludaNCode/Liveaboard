name: Daily refresh

# The liveaboard.com crawl, and nothing else.
#
# It used to be four sources in one job — the ECB rates, this crawl, the
# per-trip itinerary fragments and PADI's deals listing — so proving a change
# to any of them meant running all of them. `tools/fetch_deals.py` makes **two
# requests**, and the only way to exercise it on a runner was a job that
# fetched 320 vessel pages from a site with nothing to do with the change
# (#123). Those three now have their own workflows: `fx.yml`, `deals.yml` and
# `itineraries.yml`, each dispatchable, each capped where a cap makes sense.
#
# What is left is the expensive one. Four month listings plus one page per
# vessel per season month, at the polite delay — roughly 320 requests and a
# quarter of an hour — which is why it keeps the schedule and why it is worth
# not running to test something else.
#
# Each of the four commits its own data *and* the dataset built from it,
# because every one of those files is a promote input: committing an input
# without re-promoting leaves `promote --check` red until something unrelated
# heals it.
on:
  schedule:
    # 04:15 UTC daily — outside European browsing hours, and after operators
    # have typically published overnight availability changes.
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Cap vessels crawled (0 = the adapter default)"
        type: string
        default: "0"
      force_promote:
        description: "Publish even if the dataset shrinks sharply"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only the tests that answer to `src/`. The ones that assert against
      # committed data are a **publication** gate and are deliberately not run
      # here — see tests/published.py. Running them in front of a fetch is how
      # cabins.yml deadlocked on 2026-08-30: a stale cabin book contradicted
      # the rows the refresh had just written, the suite failed on that, and
      # the only job able to refresh the book exited before its fetch step.
      #
      # A run that fetches and then refuses to publish is recoverable. One
      # that refuses to fetch is not.
      - name: Run the code's own tests
        run: LIVEABOARD_TESTS=code PYTHONPATH=src python3 -m unittest discover -s tests

      # One source here, and not because the other is parked — that comment
      # stood until 2026-08-30 and both halves of it had stopped being true:
      # padi.com's entry paths answer 200, and it contributes a berth price on
      # 654 sailings, 53 of which it is the only seller of. It is read by
      # `padi.yml`, on its own cadence, through the JSON API rather than this
      # adapter. What is left of the original point still holds: one source per
      # job, so a failing crawl cannot muddy a good one.
      - name: Scrape liveaboard.com
        id: scrape
        continue-on-error: true
        run: |
          PYTHONPATH=src python3 -m liveaboard.cli scrape \
            --source liveaboard.com \
            --max-pages "${{ inputs.max_pages || 0 }}" \
            --out data/candidate.json \
            --snapshots data/snapshots

      # What each trip says about itself: the reefs it visits, its dive count,
      # its group size and its entry bar. A separate endpoint from the vessel
      # page, and the only per-*trip* source there is — everything else here
      # describes the boat's year, which is why "Simply the Best" had no reefs
      # and a St John's week once carried a badge for a reef 600 km away.
      #
      # After the scrape because it reads the tour ids out of the archive that
      # scrape just wrote, and before the promote that consumes its output.
      #
      # Incremental by design: a trip's reefs do not change from night to
      # night, so only genuinely new trips are fetched. The first run is about
      # 314 requests at the fetcher's usual delay; every run after it is a
      # handful, which is what makes this affordable to do daily at all.
      #
      # `itinerary_limit` caps a dispatched run. A capped run *merges* into the
      # book rather than replacing it — it knows nothing about the trips it did
      # not visit — which is what makes it safe to prove a new parser against
      # three real trips before pointing it at three hundred of somebody
      # else's pages. The same rule as `scrape_fees.py --limit`.
      - name: Promote the candidate
        id: promote
        if: steps.scrape.outcome == 'success'
        continue-on-error: true
        run: |
          PYTHONPATH=src python3 -m liveaboard.cli promote \
            --candidate data/candidate.json \
            --out data/egypt-2027.json \
            ${{ inputs.force_promote && '--force' || '' }}

      - name: Report a blocked or empty scrape
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::warning::Scrape did not complete. The site will rebuild from the"
          echo "::warning::last good dataset. Download the snapshots artifact to see"
          echo "::warning::what the source sites actually returned."

      - name: Keep the raw pages as evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ github.run_id }}
          path: data/snapshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Pick the dataset to publish
        id: dataset
        run: |
          # Prefer promoted, scraped data; fall back to the seed so a failed
          # scrape publishes yesterday's site rather than nothing.
          if [ -f data/egypt-2027.json ]; then
            echo "path=data/egypt-2027.json" >> "$GITHUB_OUTPUT"
          else
            echo "path=data/seed/egypt-2027.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the dataset
        run: PYTHONPATH=src python3 -m liveaboard.cli check --data ${{ steps.dataset.outputs.path }}

      - name: Build the site
        run: PYTHONPATH=src python3 -m liveaboard.cli build --data ${{ steps.dataset.outputs.path }}

      # The publication gate, and it is CI's own list rather than a subset of
      # it. These commits are pushed with the default `GITHUB_TOKEN`, which
      # GitHub deliberately does not trigger workflows on, so this step is the
      # only CI a scheduled data commit will ever get — and without it a
      # refresh can turn main red for however long it takes somebody to open
      # an unrelated pull request. It happened, for about seven hours.
      #
      # After the fetch and before the commit, which is the distinction #118
      # exists for. A failure here stops the commit and the push: this run
      # publishes nothing, and the next run still reaches its fetch step
      # whatever this one said. The loop is broken, at the cost of one run's
      # fetch.
      - name: Check what is about to be published
        uses: ./.github/actions/checks

      # Before the commit, while HEAD is still yesterday's dataset. Afterwards
      # the comparison would be against the run's own output.
      #
      # Three destinations, because a run summary is gone once the run ages
      # out: the summary for whoever opens the run, data/CHANGES.md for the
      # durable history, and one line captured for the commit subject so
      # `git log --oneline data/` reads as the changelog it always was.
      - name: Report what changed
        id: changed
        run: |
          PYTHONPATH=src python3 -m liveaboard.cli changes \
            --data ${{ steps.dataset.outputs.path }} \
            --revision HEAD \
            --append data/CHANGES.md \
            >> "$GITHUB_STEP_SUMMARY"
          headline=$(PYTHONPATH=src python3 -m liveaboard.cli changes \
            --data ${{ steps.dataset.outputs.path }} --revision HEAD --headline)
          echo "headline=${headline}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        uses: ./.github/actions/publish
        with:
          subject: "data: daily refresh {today}"
          headline: ${{ steps.changed.outputs.headline }}
          nothing: "nothing changed today"
