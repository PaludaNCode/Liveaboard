name: Refresh exchange rates

# One request, to the European Central Bank, for the number that sits under
# every figure on the page: every advertised price is quoted in dollars and the
# site shows euro.
#
# Its own workflow because of #123 — one source per job, so a change to one can
# be proved without running the others. It is the smallest of the four the
# daily refresh used to bundle, and splitting it still pays: the step carried
# `continue-on-error: true` with the comment *"a missed rate is not worth
# losing a whole refresh over"*, and that hack exists only because a failure
# here could take a 320-page crawl down with it. Alone, an ECB outage fails
# this job, says so, and touches nothing else. The tool already keeps the
# previous file, which records the day it was quoted, and the page says when a
# rate has stopped moving.
#
# Ahead of the crawl, so a slow crawl cannot push the read past the ECB's
# publication.

on:
  schedule:
    - cron: "5 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fx-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fx:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only the tests that answer to `src/`. An assertion about committed data
      # gates the commit below and must never stop the fetch that would correct
      # it. See tests/published.py.
      - name: Run the code's own tests
        run: LIVEABOARD_TESTS=code PYTHONPATH=src python3 -m unittest discover -s tests

      - name: Read today's rates
        run: python3 tools/fetch_fx.py --out data/fx.json

      # Hand over the reading, never the dataset built from it. `publish.yml`
      # rebuilds both from the branch tip so a derived file cannot arrive
      # stale — see the note at the top of that file.
      - uses: actions/upload-artifact@v4
        with:
          name: fx-inputs-${{ github.run_id }}
          path: data/fx.json
          retention-days: 1

  # `data/fx.json` is a promote input, so one commit carries the new rates
  # *and* the dataset built from them. Committing the rates alone would leave
  # `promote --check` red until something unrelated healed it.
  publish:
    needs: fx
    uses: ./.github/workflows/publish.yml
    with:
      carry: fx-inputs-${{ github.run_id }}
      # `retrieved` is stamped whether or not the ECB moved, so this asks
      # only whether the reading arrived. It did not on 2026-09-03: the run
      # committed "exchange rates 2026-09-03" over rates retrieved on 08-31,
      # because the subject takes `{today}` and the file did not.
      fresh: data/fx.json
      subject: "data: exchange rates {today}"
      nothing: "rates unchanged since the last reading"
