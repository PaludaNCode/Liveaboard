name: CI

# What a commit has to satisfy. The list itself lives in
# `.github/actions/checks`, because the four data workflows run it too: they
# push with the default `GITHUB_TOKEN` and GitHub does not trigger workflows on
# those pushes, so a scheduled commit that never runs this is a commit nothing
# checks. One definition, used in five places, is what makes "the same bar"
# true rather than intended.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: ./.github/actions/checks
        with:
          # Named tests are worth their line count here, where somebody is
          # reading the run to find out what their change broke.
          verbose: "true"
