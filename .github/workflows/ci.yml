name: CI

# What a commit has to satisfy. The list itself lives in
# `.github/actions/checks`, because the four data workflows run it too: they
# push with the default `GITHUB_TOKEN` and GitHub does not trigger workflows on
# those pushes, so a scheduled commit that never runs this is a commit nothing
# checks. One definition, used in five places, is what makes "the same bar"
# true rather than intended.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: ./.github/actions/checks
        with:
          # Named tests are worth their line count here, where somebody is
          # reading the run to find out what their change broke.
          verbose: "true"

  # The layout claims, measured rather than grepped.
  #
  # Not in `.github/actions/checks` with the rest of the bar, and that is the
  # point of it being here: the four data workflows run that action too, and
  # none of them should have to install a browser to commit a price. This job
  # is the one place a browser is worth the minute it costs.
  #
  # tests/test_layout.py skips when Playwright is absent, so
  # `unittest discover` still needs nothing on a bare checkout -- and a test
  # that only ever skips protects nothing, which is what this job is for.
  #
  # It exists because the alternative was tried and failed silently. The three
  # views shipped with eight tests asserting that the *source text* of their
  # layout rules was present, and every one of them passed over a sale view
  # whose table rendered at zero height at 768x600 (#130) -- including the one
  # named for the panel that caused it.
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      # Against the built page rather than the committed one, so a template
      # change is measured in the same run that makes it. `promote --check` in
      # the checks action is what keeps the committed page honest.
      - name: Site builds
        run: PYTHONPATH=src python3 -m liveaboard.cli build

      - name: Views measure up
        run: PYTHONPATH=src python3 -m unittest tests.test_layout -v

