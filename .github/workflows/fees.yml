name: Weekly fee refresh

# Collects vessel fee disclosures with a real browser.
#
# Separate from the daily refresh, and slower, because the two have different
# natures. Prices and availability change constantly and are cheap to fetch.
# Fees are a property of the vessel and do not change with the month, so
# re-rendering ninety pages every night would spend a lot of someone else's CPU
# to learn the same answer.
#
# Writes data/fees.json. The daily promote step picks it up if present, so the
# two schedules stay independent: a failed fee run leaves last week's fees in
# place rather than blanking them.

on:
  schedule:
    # Sundays 03:10 UTC — quiet, and it lands before the daily refresh so the
    # week starts with fresh fees.
    - cron: "10 3 * * 0"

  # A fee-parser fix reaches nothing until this run happens again: promote
  # prefers the committed book, rightly, because a browser sees extras the raw
  # HTML never will. So the parser changing is itself a reason to re-collect.
  # Scoped to main and to the three files that decide what a fee means, so an
  # unrelated push does not send a browser at seventy-nine of someone else's
  # pages.
  push:
    branches: [main]
    paths:
      - "src/liveaboard/scrape/fees.py"
      - "src/liveaboard/scrape/gear.py"
      - "src/liveaboard/scrape/vessel.py"

  workflow_dispatch:
    inputs:
      limit:
        description: "Cap vessels visited (0 = all)"
        type: string
        default: "0"

permissions:
  contents: write

concurrency:
  group: fee-refresh
  cancel-in-progress: false

jobs:
  fees:
    runs-on: ubuntu-latest
    outputs:
      collected: ${{ steps.collect.outcome == 'success' }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Collect fees
        id: collect
        run: |
          python3 tools/scrape_fees.py \
            --out data/fees.json \
            --limit "${{ inputs.limit || 0 }}"

      # Hand over the fee book, never the dataset built from it. `publish.yml`
      # rebuilds both from the branch tip, so a derived file cannot arrive
      # stale -- see the note at the top of that file.
      #
      # The seed fallback the build step used to carry is gone with the split
      # rather than moved: the publish job checks out the tip, which already
      # holds the last good dataset, so the fallback could only ever commit
      # something identical to what was already there.
      - uses: actions/upload-artifact@v4
        if: steps.collect.outcome == 'success'
        with:
          name: fees-inputs-${{ github.run_id }}
          path: data/fees.json
          retention-days: 1

  # This job runs no tests before its browser crawl, on the rule that an
  # assertion about a stale fee book must never stop the fetch that refreshes
  # it. `publish.yml` runs CI's whole list before it commits, which is the
  # other half of that rule and the only CI these pushes ever get.
  publish:
    needs: fees
    if: needs.fees.outputs.collected == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      carry: fees-inputs-${{ github.run_id }}
      # The book's own `scraped_at`, not the `retrieved` inside each vessel's
      # entry: a capped run merges, so most vessels in the file are older than
      # the run that wrote it and only the book-level date says the book
      # arrived.
      fresh: data/fees.json
      changes: true
      subject: "data: weekly fee refresh {today}"
      nothing: "fees unchanged this week"
