name: Weekly fee refresh

# Collects vessel fee disclosures with a real browser.
#
# Separate from the daily refresh, and slower, because the two have different
# natures. Prices and availability change constantly and are cheap to fetch.
# Fees are a property of the vessel and do not change with the month, so
# re-rendering ninety pages every night would spend a lot of someone else's CPU
# to learn the same answer.
#
# Writes data/fees.json. The daily promote step picks it up if present, so the
# two schedules stay independent: a failed fee run leaves last week's fees in
# place rather than blanking them.

on:
  schedule:
    # Sundays 03:10 UTC — quiet, and it lands before the daily refresh so the
    # week starts with fresh fees.
    - cron: "10 3 * * 0"

  # A fee-parser fix reaches nothing until this run happens again: promote
  # prefers the committed book, rightly, because a browser sees extras the raw
  # HTML never will. So the parser changing is itself a reason to re-collect.
  # Scoped to main and to the three files that decide what a fee means, so an
  # unrelated push does not send a browser at seventy-nine of someone else's
  # pages.
  push:
    branches: [main]
    paths:
      - "src/liveaboard/scrape/fees.py"
      - "src/liveaboard/scrape/gear.py"
      - "src/liveaboard/scrape/vessel.py"

  workflow_dispatch:
    inputs:
      limit:
        description: "Cap vessels visited (0 = all)"
        type: string
        default: "0"

permissions:
  contents: write

concurrency:
  group: fee-refresh
  cancel-in-progress: false

jobs:
  fees:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Collect fees
        id: collect
        run: |
          python3 tools/scrape_fees.py \
            --out data/fees.json \
            --limit "${{ inputs.limit || 0 }}"

      - name: Rebuild with the new fees
        if: steps.collect.outcome == 'success'
        run: |
          if [ -f data/candidate.json ]; then
            PYTHONPATH=src python3 -m liveaboard.cli promote \
              --candidate data/candidate.json \
              --fees data/fees.json \
              --out data/egypt-2027.json
          fi
          PYTHONPATH=src python3 -m liveaboard.cli build \
            --data "$([ -f data/egypt-2027.json ] && echo data/egypt-2027.json || echo data/seed/egypt-2027.json)"

      # This job ran no tests at all, and it writes prices. Its commits are
      # pushed with the default `GITHUB_TOKEN`, which GitHub deliberately does
      # not trigger workflows on, so nothing has ever checked one of them —
      # not before the push and not after it, until whoever opens the next
      # pull request finds out.
      #
      # Here rather than in front of the browser run, on the same rule as the
      # other three: a fee book two days stale is a thing a *fetch* corrects,
      # and an assertion about it must never stop the fetch. The cost of a
      # failure is one week's collection; the cost of the alternative is a job
      # that can never run.
      - name: Check what is about to be published
        uses: ./.github/actions/checks

      # Before the commit, while HEAD is still last week's dataset. Afterwards
      # the comparison would be against this run's own output.
      #
      # The same three destinations as the daily refresh: the run summary for
      # whoever opens the run, data/CHANGES.md for the durable history, and one
      # line for the commit subject. This run re-promotes from the *existing*
      # candidate, so departures and fares cannot move -- a fee change is the
      # only thing it can report, which is exactly what it is for.
      - name: Report what changed
        id: changed
        if: hashFiles('data/egypt-2027.json') != ''
        run: |
          PYTHONPATH=src python3 -m liveaboard.cli changes \
            --revision HEAD \
            --append data/CHANGES.md \
            >> "$GITHUB_STEP_SUMMARY"
          headline=$(PYTHONPATH=src python3 -m liveaboard.cli changes \
            --revision HEAD --headline)
          echo "headline=${headline}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        uses: ./.github/actions/publish
        with:
          subject: "data: weekly fee refresh {today}"
          headline: ${{ steps.changed.outputs.headline }}
          nothing: "fees unchanged this week"
