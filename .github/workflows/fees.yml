name: Weekly fee refresh

# Collects vessel fee disclosures with a real browser.
#
# Separate from the daily refresh, and slower, because the two have different
# natures. Prices and availability change constantly and are cheap to fetch.
# Fees are a property of the vessel and do not change with the month, so
# re-rendering ninety pages every night would spend a lot of someone else's CPU
# to learn the same answer.
#
# Writes data/fees.json. The daily promote step picks it up if present, so the
# two schedules stay independent: a failed fee run leaves last week's fees in
# place rather than blanking them.

on:
  schedule:
    # Sundays 03:10 UTC — quiet, and it lands before the daily refresh so the
    # week starts with fresh fees.
    - cron: "10 3 * * 0"
  workflow_dispatch:
    inputs:
      limit:
        description: "Cap vessels visited (0 = all)"
        type: string
        default: "0"

permissions:
  contents: write

concurrency:
  group: fee-refresh
  cancel-in-progress: false

jobs:
  fees:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Collect fees
        id: collect
        run: |
          python3 tools/scrape_fees.py \
            --out data/fees.json \
            --limit "${{ inputs.limit || 0 }}"

      - name: Rebuild with the new fees
        if: steps.collect.outcome == 'success'
        run: |
          if [ -f data/candidate.json ]; then
            PYTHONPATH=src python3 -m liveaboard.cli promote \
              --candidate data/candidate.json \
              --fees data/fees.json \
              --out data/egypt-2027.json
          fi
          PYTHONPATH=src python3 -m liveaboard.cli build \
            --data "$([ -f data/egypt-2027.json ] && echo data/egypt-2027.json || echo data/seed/egypt-2027.json)"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data site
          if git diff --cached --quiet; then
            echo "fees unchanged this week"
            exit 0
          fi
          # Every run is a commit, so the git history doubles as price history:
          # `git log -p data/` shows exactly which fee moved, and when.
          git commit -m "data: weekly fee refresh $(date -u +%Y-%m-%d)"

          # A scrape takes minutes, and anything can land meanwhile -- the
          # other scheduled job, or a merge. A plain push is rejected and the
          # whole run's data is thrown away. Rebase and retry instead.
          # -X theirs favours the commit being replayed, which is ours: these
          # files are regenerated output, so the fresh copy always wins.
          #
          # Rebase onto the branch this run is actually on. It used to rebase
          # onto origin/main unconditionally, which is a no-op on any other
          # branch -- so a run dispatched against a feature branch retried
          # three times against the wrong ref, reported "up to date" each time
          # and threw away eight minutes of scraping.
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${branch}"; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/${branch}"
            git fetch origin "$branch"
            git rebase -X theirs FETCH_HEAD || { git rebase --abort; exit 1; }
          done
          echo "::error::could not push after 3 attempts"
          exit 1
