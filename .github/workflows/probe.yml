name: Probe the crawl

# Answers questions a development sandbox cannot: the sandbox is behind a
# strict egress allowlist and cannot reach the source at all, so anything about
# what the site actually returns has to be measured from a runner.
#
# Deliberately separate from the scrape and manual only. It makes five requests
# and writes nothing, so it can be run while wondering rather than scheduled.
#
# `only` runs one job. Without it, asking one question costs every source a
# full sweep -- which is the same complaint that split refresh.yml: proving a
# two-request change to fetch_deals.py meant first fetching 320 vessel pages
# from a site with nothing to do with it.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Run one job rather than all of them (all/probe/padi/unread/gear/divebooker)"
        type: string
        default: "all"
      gear_vessels:
        description: "Vessel slugs to open the gear modal on"
        type: string
        default: "aphrodite,blue-seas,emperor-asmaa"
      itinerary_vessel:
        description: "Vessel whose trip detail to open"
        type: string
        default: "emperor-asmaa"
      itinerary_tours:
        description: "Tour ids (from the Event url's #tourid= fragment)"
        type: string
        default: "353503,353505"
      dump_html:
        description: "Print the modal's markup, not just its text"
        type: boolean
        default: false
      padi_vessel:
        description: "PADI Travel vessel whose bundle to read"
        type: string
        default: "hammerhead-ii"
      padi_dump_context:
        description: "Print the JS around each path literal PADI's bundle holds"
        type: boolean
        default: false
      padi_max_candidates:
        description: "PADI endpoints to call (0 reads the bundles without calling)"
        type: string
        default: "24"
      padi_only_base:
        description: "Print only where PADI's API client gets its base URL"
        type: boolean
        default: false
      divebooker_ask:
        description: "Which divebooker questions to ask: robots,shell,fare,currency,details,feeshape,feejoin,verdict,persailing,cabins,booking,fixture,flight,search,specials"
        type: string
        default: ""
      divebooker_sample:
        description: "Detail pages to sample per sitemap shape (divebooker)"
        type: string
        default: "3"
      divebooker_requests:
        description: "Hard ceiling on divebooker requests for one run"
        type: string
        default: "25"
      divebooker_vessels:
        description: "Vessel pages to read departure nodes from"
        type: string
        default: "3"
      divebooker_fetch:
        description: "Vessels to read into a book and upload (0 skips the fetch)"
        type: string
        default: "0"
      divebooker_emit_pages:
        description: "Saved pages whose JSON-LD to print (smallest first)"
        type: string
        default: "1"
      divebooker_vessel:
        description: "Vessel slug for the flight probe, as the book names it"
        type: string
        default: "red-sea-aggressor-ii"
      divebooker_trips:
        description: "tripId values for the booking probe, e.g. 254581"
        type: string
        default: "254581"
      divebooker_months:
        description: "Year-months for the search probe, e.g. 202705,202706"
        type: string
        default: "202705,202706,202707"
      divebooker_params:
        description: "Query fragments to try for search paging, e.g. page=2,offset=20"
        type: string
        default: ""
      unread_retries:
        description: "Fetches per unreadable page, to tell transient from persistent"
        type: string
        default: "2"
      spaces_targets:
        description: "vessel:month pairs to check for a remaining-berth count"
        type: string
        default: "dune-longara:5,tala:5,emperor-superior:6,all-star-red-sea:7"
      booking_tours:
        description: "boatid:tourid pairs to read BookingStep1 for (#79)"
        type: string
        # Three shapes, not one: the trip the owner pointed at (three cabins,
        # all discounted, all with a berth count), a sold-out sailing, and a
        # longer, dearer week on another vessel. A cabin parser proved against
        # a single page is a parser proved against one page's coincidences.
        default: "6240:415714,6568:412135,6565:421166"

permissions:
  contents: read

jobs:
  probe:
    if: inputs.only == 'all' || inputs.only == 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe the crawl
        run: python3 tools/probe_crawl.py

      - name: Probe for dive counts
        run: python3 tools/probe_dives.py --limit 8

      # What the "What to expect" prose looks like on every vessel. A parser
      # written against one hand-trimmed fixture matched nothing on six real
      # trips, so this establishes the shape across the fleet before another
      # pattern is written against a guess.
      - name: Probe the itinerary prose across every vessel
        run: python3 tools/probe_itinerary_prose.py

      # The fourth heading on every fragment, and the only one never parsed.
      # Named "Route", which is exactly the question the dive-site column asks,
      # so it is read before anything is written against it.
      - name: Read the Route block nothing has parsed
        run: python3 tools/probe_itinerary_route.py --boats 6

  # PADI's app bundles are on CloudFront, which the sandbox's egress policy
  # refuses outright -- and a browser is no help there either, since it would
  # load the page and then fail to load the app. So the one place the itinerary
  # endpoint can be found is here. Its own job: it reads two hosts and neither
  # of them is liveaboard.com.
  padi:
    if: inputs.only == 'all' || inputs.only == 'padi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Find the endpoint PADI's itinerary popup calls
        run: |
          python3 tools/probe_padi_bundle.py \
            --vessel "${{ inputs.padi_vessel || 'hammerhead-ii' }}" \
            --max-candidates "${{ inputs.padi_max_candidates || '24' }}" \
            ${{ inputs.padi_only_base && '--only-base' || '' }} \
            ${{ inputs.padi_dump_context && '--dump-context' || '' }}

  # Its own job, not another step above: fourteen pages at two fetches each,
  # paced by the crawl delay, is minutes on its own and the probe job is
  # already close to its budget. It is also a different question from the rest
  # of them, and worth being able to read — or re-run — by itself.
  unread:
    if: inputs.only == 'all' || inputs.only == 'unread'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The pages the last crawl could not read at all. Fourteen of them on
      # 2026-08-28, and publishing their absence deleted 49 real, bookable
      # sailings. carry_unread stops the site lying about them; this settles
      # what to actually do -- retry, markup parser, or neither -- by reading
      # what the pages return rather than guessing at it.
      - name: Re-read the pages the crawl could not
        run: |
          python3 tools/probe_unread.py \
            --retries "${{ inputs.unread_retries || 2 }}"

      # #79, and the last place a berth count could be. The vessel page does
      # not state one anywhere, and the site's owner pointed at the booking
      # flow. Both ids are already in the archive -- every Event.@id is
      # LA-{x}-{boatID}-{tourID} -- so the URL is built rather than crawled.
      #
      # Reading only: step one of a booking is a page with a form on it, a GET
      # renders it and submits nothing, and the polite fetcher asks robots.txt
      # first. A refusal there is the answer, not an obstacle.
      - name: Read the booking page (#79)
        run: |
          python3 tools/probe_booking.py \
            --tours "${{ inputs.booking_tours || '6240:415714,6568:412135,6565:421166' }}" \
            --chars 1200 \
            --dump-cabins

      # Thirteen of the fifteen vessels on the skip list are not linked from
      # any Egypt listing, so the crawl never reaches them -- and from inside
      # the dataset "gone from the site" and "still selling, just invisible to
      # us" look identical. The second would mean discover() is losing real
      # trips, which is a bug in the crawl and not in the skip list.
      - name: Find out what happened to the delisted vessels
        run: python3 tools/probe_delisted.py

  # Separate job: the gear modal is built client-side, so this one needs a
  # browser and the plain-HTTP probes above do not.
  gear:
    if: inputs.only == 'all' || inputs.only == 'gear'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Probe the rental-gear modal
        run: |
          python3 tools/probe_gear.py \
            --vessels "${{ inputs.gear_vessels || 'aphrodite,blue-seas,emperor-asmaa' }}" \
            ${{ inputs.dump_html && '--dump-html' || '' }}

      # Whether a trip's own detail view names the reefs its title does not.
      - name: Probe a trip's detail view
        run: |
          python3 tools/probe_itinerary.py \
            --vessel "${{ inputs.itinerary_vessel || 'emperor-asmaa' }}" \
            --tours "${{ inputs.itinerary_tours || '353503,353505' }}" \
            ${{ inputs.dump_html && '--dump-html' || '' }}

      # The #tourid= fragment opens nothing, so the detail arrives after the
      # page does. This watches the network while a departure row is clicked.
      - name: Find how the trip detail is fetched
        run: |
          python3 tools/probe_trip_detail.py \
            --vessel "${{ inputs.itinerary_vessel || 'emperor-asmaa' }}" \
            ${{ inputs.dump_html && '--dump-body' || '' }}

      # Read the fragment that endpoint returns, and establish whether a plain
      # GET is enough -- which decides whether this belongs in the nightly
      # crawl or the weekly browser run.
      - name: Read the itinerary fragment
        run: |
          python3 tools/probe_itinerary_endpoint.py --tours 6 --full

      # #79. Nothing we already fetch carries a remaining-berth count: no
      # Offer key in 889 archived events, and the only inventory wording in
      # any description is a numberless "No more spaces available". So either
      # the number is rendered client-side like the fee and gear panels, or
      # the source does not publish it -- and those need opposite answers.
      - name: Probe for a remaining-berth count
        run: |
          python3 tools/probe_spaces.py \
            --targets "${{ inputs.spaces_targets || 'dune-longara:5,tala:5,emperor-superior:6,all-star-red-sea:7' }}" \
            ${{ inputs.dump_html && '--dump-html' || '' }}

  # A third seller nobody here has ever fetched. Its own job because it reads a
  # host neither of the others does, and because the first question about a new
  # source -- does it answer us at all, and on what terms -- has to be settled
  # before there is anything to point a parser at.
  #
  # The sandbox's egress allowlist refuses divebooker.com outright (403 on the
  # CONNECT), so this is the only place the question can be asked. Writes
  # nothing, capped at divebooker_requests, paced by the polite fetcher at the
  # five-second default this project uses for a host nobody has checked.
  divebooker:
    if: inputs.only == 'all' || inputs.only == 'divebooker'
    runs-on: ubuntu-latest
    # A whole-fleet read is about 95 requests at the five-second pace: four
    # months of search paging plus one page per hull, and the fee census is
    # one page per hull again. The cap is the pace times the fleet, not a
    # guess -- and the pace is what may not be cut.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read what divebooker.com serves
        run: |
          python3 tools/probe_divebooker.py \
            --sample "${{ inputs.divebooker_sample || '3' }}" \
            --max-requests "${{ inputs.divebooker_requests || '25' }}" \
            ${{ contains(inputs.divebooker_ask, 'robots') && '--dump-robots' || '' }} \
            ${{ contains(inputs.divebooker_ask, 'shell') && '--dump-shell' || '' }}

      # What a departure node actually states — which is what decides whether
      # this is a third seller or a third opinion (docs/plan-divebooker.md,
      # stage 0). A census across every Event read rather than one example:
      # a parser proved against a single node is proved against its
      # coincidences.
      - name: Read what one divebooker departure states
        run: |
          python3 tools/probe_divebooker_departures.py \
            --vessels "${{ inputs.divebooker_vessels || '3' }}"

      # The bytes themselves, so a parser can be written against what the site
      # actually serves rather than against a description of it. The fee
      # parser proved against one hand-trimmed fixture matched nothing on six
      # real trips; this is that lesson spent up front.
      #
      # Still writes nothing to the repository — the book and the pages leave
      # as an artifact, and what lands in `data/` is committed by a person
      # who has read it.
      # `all` reads the whole Egyptian fleet; a number caps it. --emit prints
      # the book and two pages' JSON-LD as gzip+base64, which is the one
      # channel back: the sandbox's egress policy refuses divebooker.com and
      # the blob host artifacts are served from, so a runner that reads this
      # source otherwise has no way to hand back what it read.
      - name: Read the Egyptian fleet into a book
        if: inputs.divebooker_fetch != '0'
        run: |
          python3 tools/fetch_divebooker.py \
            ${{ inputs.divebooker_fetch != 'all' && format('--limit {0}', inputs.divebooker_fetch) || '' }} \
            --save-html /tmp/divebooker-html \
            --book /tmp/divebooker.json \
            --emit --emit-pages "${{ inputs.divebooker_emit_pages || '1' }}"

      # The one question that decides whether a divebooker fare can ever be
      # published: what `Offer.price` counts. See the tool's own docstring.
      - name: Ask what one divebooker fare counts
        if: contains(inputs.divebooker_ask, 'fare')
        run: |
          python3 tools/probe_divebooker_fare.py \
            --vessels red-sea-aggressor-iv \
            --dates 2027-07-24,2027-07-17,2027-07-31 \
            --verbatim

      # The digits say USD and the label often says EUR. This asks the page
      # rather than inferring it from another seller's agreement.
      - name: Ask what currency a divebooker price is in
        if: contains(inputs.divebooker_ask, 'currency')
        run: python3 tools/probe_divebooker_currency.py

      # A keyword sweep said there is no fee book on the vessel page. The
      # page has a *Trip & price details* panel, and a sweep answers only
      # about the words it was given, so this enumerates the payload instead.
      - name: Read a vessel page's trip and price details
        if: contains(inputs.divebooker_ask, 'details')
        run: python3 tools/probe_divebooker_details.py

      # One page's panel is an example, not a shape. This counts what the
      # whole fleet states before anything is parsed: how many pages carry
      # the block, how many lines state money, in what currency and unit, and
      # whether this project's own fee vocabulary recognises the labels.
      - name: Measure the fee panel across the fleet
        if: contains(inputs.divebooker_ask, 'feeshape')
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/probe_divebooker_fee_shape.py | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # A fee block names its trip in a different vocabulary from the one the
      # departures use. A key that stops matching fails silently, so this
      # counts what a join would do before anything is parsed.
      - name: Can a fee block be attached to a departure
        if: contains(inputs.divebooker_ask, 'feejoin')
        # `divebooker_vessels` is the hull count here as well, and 0 is the
        # whole fleet: a join rate measured over an alphabetical handful
        # excludes whichever boat raised the doubt, which is how this one
        # nearly got believed.
        run: |
          python3 tools/probe_divebooker_fee_join.py \
            --vessels "${{ inputs.divebooker_vessels || '8' }}"

      # A fee reader guarded by bytes somebody imagined is guarded by nothing,
      # and this sandbox cannot reach the host — so the fixture travels back
      # through the log, the way the JSON-LD one did.
      - name: Carry a price panel back as a fixture
        if: contains(inputs.divebooker_ask, 'fixture')
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/emit_divebooker_fixture.py \
            --vessels "${{ inputs.divebooker_vessel || 'alsuraya,amelie' }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The shape census counted what the fleet states, with its own copy of
      # the reading. This asks the shipped reader for its own verdict: how
      # many bills add up, which is exactly how many trips reach the Total
      # with a third column, and what the rest are missing.
      - name: Ask the fee reader how many bills add up
        if: contains(inputs.divebooker_ask, 'verdict')
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/probe_divebooker_fee_verdict.py \
            --limit "${{ inputs.divebooker_vessels || '0' }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The panel is read once per trip name and attached to every sailing of
      # that trip. The vessel page puts a *Trip & price details* link on each
      # departure row, which is not the same claim — so this asks the payload
      # whether one trip name can own two panels before anybody assumes it
      # cannot.
      - name: Is the price panel per trip or per sailing
        if: contains(inputs.divebooker_ask, 'persailing')
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/probe_divebooker_details_per_sailing.py \
            --vessels "${{ inputs.divebooker_vessel || 'independence-iii' }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Two claims this project has been making by assumption: that a sailing
      # with no `Offer.price` cannot be priced at all (46 of 887), and that
      # this source has no cabin ladder, no berth count and no list price.
      # Both came from reading the vessel page. *Select cabin* is a button on
      # every departure row that nobody has pressed.
      - name: What is behind Select cabin
        if: contains(inputs.divebooker_ask, 'cabins')
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/probe_divebooker_cabins.py \
            --vessels "${{ inputs.divebooker_vessel || 'vita-xplorer,argo-egypt' }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The owner's own link: *Select cabin* opens
      # `/boatorder/booking?tripId=254581`. That is where a fare the vessel
      # listing does not state would be, and where a cabin ladder would be.
      # Robots is asked first and reported either way — this host's rules are
      # honoured, and a disallowed path is a person's decision.
      - name: What does the booking page state
        if: contains(inputs.divebooker_ask, 'booking')
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/probe_divebooker_booking.py \
            --trips "${{ inputs.divebooker_trips || '254581' }}" \
            --vessels "${{ inputs.divebooker_vessel || 'argo-egypt,omneia-spirit' }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # App Router ships its data in the HTML rather than fetching it, so
      # "rendered by JavaScript" and "not in the served bytes" are different
      # claims. This opens the streamed payload and says which is true.
      - name: Open the payload the page streams to itself
        if: contains(inputs.divebooker_ask, 'flight')
        run: |
          python3 tools/probe_divebooker_flight.py \
            --vessel "${{ inputs.divebooker_vessel || 'red-sea-aggressor-ii' }}"

      # `docs/sources/divebooker.com.md` records "no list price" as a negative
      # -- measured over 219 departures on vessel pages, and the same file's
      # entry-point table names `/specials?et=3&e=1`, 130 priced trips with a
      # `UnitPriceSpecification` apiece, which nobody has opened. A negative
      # measured on one page is not a negative about a host, and "on sale" is
      # the question it decides. Reads the deals page, the unread node type on
      # a vessel page, and sweeps the streamed payload for a markdown-shaped
      # key -- the sweep that missed the fee panel asked about four words.
      - name: Does this seller state a list price anywhere
        if: contains(inputs.divebooker_ask, 'specials')
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/probe_divebooker_specials.py \
            --vessels "${{ inputs.divebooker_vessel || 'alsuraya,amelie' }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The seller's own search, which says 75 boats for a month the country
      # page shows ten of. Open to us: the Disallow sits in the turnitinbot
      # record, not the `*` one.
      - name: Read the seller's own search
        if: contains(inputs.divebooker_ask, 'search')
        run: |
          python3 tools/probe_divebooker_search.py \
            --months "${{ inputs.divebooker_months || '202705,202706,202707' }}" \
            --try-params "${{ inputs.divebooker_params }}"

      - name: Upload the book and the pages it was read from
        if: inputs.divebooker_fetch != '0'
        uses: actions/upload-artifact@v4
        with:
          name: divebooker
          path: |
            /tmp/divebooker.json
            /tmp/divebooker-html
          retention-days: 7
