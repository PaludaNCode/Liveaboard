name: Probe the crawl

# Answers questions a development sandbox cannot: the sandbox is behind a
# strict egress allowlist and cannot reach the source at all, so anything about
# what the site actually returns has to be measured from a runner.
#
# Deliberately separate from the scrape and manual only. It makes five requests
# and writes nothing, so it can be run while wondering rather than scheduled.

on:
  workflow_dispatch:
    inputs:
      gear_vessels:
        description: "Vessel slugs to open the gear modal on"
        type: string
        default: "aphrodite,blue-seas,emperor-asmaa"
      itinerary_vessel:
        description: "Vessel whose trip detail to open"
        type: string
        default: "emperor-asmaa"
      itinerary_tours:
        description: "Tour ids (from the Event url's #tourid= fragment)"
        type: string
        default: "353503,353505"
      dump_html:
        description: "Print the modal's markup, not just its text"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe the crawl
        run: python3 tools/probe_crawl.py

      - name: Probe for dive counts
        run: python3 tools/probe_dives.py --limit 8

      # What the "What to expect" prose looks like on every vessel. A parser
      # written against one hand-trimmed fixture matched nothing on six real
      # trips, so this establishes the shape across the fleet before another
      # pattern is written against a guess.
      - name: Probe the itinerary prose across every vessel
        run: python3 tools/probe_itinerary_prose.py

  # Separate job: the gear modal is built client-side, so this one needs a
  # browser and the plain-HTTP probes above do not.
  gear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Probe the rental-gear modal
        run: |
          python3 tools/probe_gear.py \
            --vessels "${{ inputs.gear_vessels || 'aphrodite,blue-seas,emperor-asmaa' }}" \
            ${{ inputs.dump_html && '--dump-html' || '' }}

      # Whether a trip's own detail view names the reefs its title does not.
      - name: Probe a trip's detail view
        run: |
          python3 tools/probe_itinerary.py \
            --vessel "${{ inputs.itinerary_vessel || 'emperor-asmaa' }}" \
            --tours "${{ inputs.itinerary_tours || '353503,353505' }}" \
            ${{ inputs.dump_html && '--dump-html' || '' }}

      # The #tourid= fragment opens nothing, so the detail arrives after the
      # page does. This watches the network while a departure row is clicked.
      - name: Find how the trip detail is fetched
        run: |
          python3 tools/probe_trip_detail.py \
            --vessel "${{ inputs.itinerary_vessel || 'emperor-asmaa' }}" \
            ${{ inputs.dump_html && '--dump-body' || '' }}

      # Read the fragment that endpoint returns, and establish whether a plain
      # GET is enough -- which decides whether this belongs in the nightly
      # crawl or the weekly browser run.
      - name: Read the itinerary fragment
        run: |
          python3 tools/probe_itinerary_endpoint.py --tours 6 --full
