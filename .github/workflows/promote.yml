name: Re-promote

# Rebuild data/egypt-2027.json from the *committed* candidate, with no network.
#
# The daily refresh is the only thing that regenerated the dataset, and it runs
# the full crawl. So a change to promote.py sat in the repository doing nothing
# until an unrelated scheduled job happened to fire, and until then the
# committed dataset disagreed with the code that produced it. CI tests fixtures,
# not data/, so that state was green.
#
# promote is pure: candidate + fees + facts + FX in, dataset out, no requests.
# It takes seconds. There is no reason for the dataset to lag the parser by
# more than one merge, so this closes the gap by rebuilding on every merge that
# touches the library.
#
# Deliberately NOT a scrape. This asks liveaboard.com for nothing at all -- it
# re-reads what the last crawl already committed, which is why it can run on
# every push without being rude to the source.

on:
  push:
    branches: ["main"]
    paths:
      # Any change to the library can change promote's output: promote.py most
      # directly, but classification, taxonomy and money feed it too.
      - "src/liveaboard/**"
      # A hand-edited fact changes the dataset without any code changing at
      # all, and nothing else re-promotes after it.
      - "data/operator_facts.json"
      #
      # `data/fx.json`, `data/itineraries.json` and `data/deals.json` were
      # listed here too, as a net: they were written by steps inside
      # refresh.yml, and a fetch that landed while the promote step was
      # skipped would leave `promote --check` red until something unrelated
      # touched the library. #123 gave each of them its own workflow, and each
      # of those promotes, rebuilds and runs the checks before committing --
      # so the case the net covered no longer exists, and watching them only
      # fired a second re-promote with nothing to do.
      - ".github/workflows/promote.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if the dataset shrinks sharply"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Shares a group with nothing else on purpose, but never runs beside itself:
  # two jobs re-promoting and pushing the same file is a guaranteed conflict.
  group: re-promote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nothing to fetch: this job re-derives from inputs already committed, after
  # a change to `src/` or to a hand-maintained file no crawl touches. It still
  # goes through `publish.yml` because it *pushes*, and anything that pushes
  # takes its turn -- a re-promote racing a data job is the same collision as
  # two data jobs racing each other.
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      force: ${{ inputs.force || false }}
      subject: "data: re-promote after {sha}"
      nothing: "dataset already matches the parser; nothing to commit"
