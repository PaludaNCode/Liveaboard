name: Re-promote

# Rebuild data/egypt-2027.json from the *committed* candidate, with no network.
#
# The daily refresh is the only thing that regenerated the dataset, and it runs
# the full crawl. So a change to promote.py sat in the repository doing nothing
# until an unrelated scheduled job happened to fire, and until then the
# committed dataset disagreed with the code that produced it. CI tests fixtures,
# not data/, so that state was green.
#
# promote is pure: candidate + fees + facts + FX in, dataset out, no requests.
# It takes seconds. There is no reason for the dataset to lag the parser by
# more than one merge, so this closes the gap by rebuilding on every merge that
# touches the library.
#
# Deliberately NOT a scrape. This asks liveaboard.com for nothing at all -- it
# re-reads what the last crawl already committed, which is why it can run on
# every push without being rude to the source.

on:
  push:
    branches: ["main"]
    paths:
      # Any change to the library can change promote's output: promote.py most
      # directly, but classification, taxonomy and money feed it too.
      - "src/liveaboard/**"
      # A hand-edited fact or exchange rate changes the dataset without any
      # code changing at all.
      - "data/operator_facts.json"
      - "data/fx.json"
      # The per-trip book, written by its own crawl in refresh.yml. It fills
      # dive sites, dive counts and the entry bar, so a fresh one is a new
      # dataset with no code change at all.
      - "data/itineraries.json"
      - ".github/workflows/promote.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if the dataset shrinks sharply"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Shares a group with nothing else on purpose, but never runs beside itself:
  # two jobs re-promoting and pushing the same file is a guaranteed conflict.
  group: re-promote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests

      # On the defaults, like refresh.yml, fees.yml and CI's drift check. One
      # canonical set of inputs, defined in cli.py, that cannot drift apart
      # across four workflows.
      - name: Re-promote from the committed candidate
        run: |
          PYTHONPATH=src python3 -m liveaboard.cli promote \
            ${{ inputs.force && '--force' || '' }}

      - name: Validate the dataset
        run: PYTHONPATH=src python3 -m liveaboard.cli check --data data/egypt-2027.json

      - name: Build the site
        run: PYTHONPATH=src python3 -m liveaboard.cli build --data data/egypt-2027.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data site
          if git diff --cached --quiet; then
            # The normal outcome on a merge that changed the library without
            # changing its output. Not a failure, and worth saying plainly:
            # it is also the proof that the dataset was already current.
            echo "dataset already matches the parser; nothing to commit"
            exit 0
          fi
          git commit -m "data: re-promote after ${GITHUB_SHA:0:7}"

          # Same recovery as the scraping workflows, and for the same reason:
          # anything can land while this runs. Rebase onto the branch being
          # pushed -- not onto main unconditionally, which is a no-op on any
          # other ref and retries the identical rejected push three times.
          # -X theirs favours the commit being replayed, which is ours: these
          # files are regenerated output, so the fresh copy always wins.
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${branch}"; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/${branch}"
            git fetch origin "$branch"
            git rebase -X theirs FETCH_HEAD || { git rebase --abort; exit 1; }
          done
          echo "::error::could not push after 3 attempts"
          exit 1
