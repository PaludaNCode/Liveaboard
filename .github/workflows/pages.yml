name: Publish site

# Deploys site/index.html to GitHub Pages.
#
# Requires a one-time manual step: Settings -> Pages -> Source: GitHub Actions.
# Until that is set, this workflow fails and nothing is published — deliberate,
# so the site cannot go public without someone choosing to make it public.
#
# The workflow_run triggers are load-bearing. GitHub deliberately does not start
# a workflow from a push made with the default GITHUB_TOKEN, so the scheduled
# jobs' data commits never fired the push trigger below: three refreshes landed
# on main and the published page kept serving the build from the first deploy.
# workflow_run fires on another workflow finishing, whoever pushed, which is the
# only trigger that actually sees a bot commit.

on:
  push:
    branches: [main]
    # The job rebuilds the page from the dataset rather than publishing the
    # committed HTML, so anything that changes what `cli build` emits belongs
    # here. Watching site/** alone meant a fix to the template or the renderer
    # never reached the live page: the commit changed no file under site/, so
    # nothing fired, and the deployed HTML kept whatever the last data commit
    # happened to build.
    paths:
      - "site/**"
      - "templates/**"
      - "src/**"
      - "data/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    # Every workflow that commits under data/ or site/ belongs here, and the
    # list is only ever wrong in the silent direction: a data commit lands on
    # main, nothing fires, and the published page keeps serving an older build
    # while the repository says it was updated. That is the failure described
    # above, and it recurred -- three of these were missing. `Read cabin prices
    # and berths left` writes a berth count that is stale by morning, so a
    # nightly run whose result never reaches the page is the worst case of it.
    workflows:
      - "Daily refresh"
      - "Weekly fee refresh"
      - "Read cabin prices and berths left"
      - "Read trip itineraries"
      - "Re-promote"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A refresh that failed mid-way may still have rebuilt the page from stale
    # data; publishing that would present a broken run's output as current.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' 
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Rebuild rather than trusting the committed file, so the published page
      # always matches the dataset in the same commit.
      #
      # The dataset is named explicitly. This step used to rely on the build
      # default, which pointed at the seed, so every deploy published five
      # placeholder boats while the repository held sixty-seven scraped ones.
      # The default now prefers the real dataset, but a deploy should not be
      # the thing that discovers a default changed underneath it.
      - name: Build
        run: |
          PYTHONPATH=src python3 -m liveaboard.cli build \
            --data "$([ -f data/egypt-2027.json ] && echo data/egypt-2027.json || echo data/seed/egypt-2027.json)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
