name: Repository checks
description: >
  Everything CI asserts about a commit, in one place, so a scheduled data
  commit is held to the same bar as a pull request.

# GitHub does not trigger workflows on pushes made with the default
# `GITHUB_TOKEN` — the standard guard against a job triggering itself. Every
# data workflow here pushes with exactly that token, so **not one scheduled
# data commit has ever had a CI run against it**. The history on `main` shows
# it: the only runs are `Merge pull request #…`.
#
# That is not academic. On 2026-08-30 the daily refresh re-priced the Red Sea
# Aggressors when their 33% sale ended, while `data/cabins.json` had last been
# read on the 28th, and the published page carried 36 sailings advertising
# €2,371 above a cabin ladder starting at €1,588 — a berth nobody could buy, on
# the site whose whole argument is that advertised prices should be checked.
# `test_the_advertised_price_is_the_bottom_of_the_ladder` catches exactly that
# and had been in the suite for days. It never ran against the commit that
# introduced it. Main sat red for about seven hours and the only thing that
# noticed was a human opening an unrelated pull request. And `pages.yml`
# deploys on `workflow_run`, so that page went out.
#
# Of the three ways to close it — a PAT on the push, a scheduled CI run on
# main, or the job checking its own work — this is the third: no secret to
# manage, and the job that broke the data is the job that reports it, rather
# than whoever opens the next pull request.
#
# It lives here rather than being repeated in five workflows because a copy
# drifts, and a check that drifts is one the data jobs are not really running.
# `ci.yml` uses this too, which is what makes "the same bar" true rather than
# intended.
#
# The caller must have run `actions/checkout` and `actions/setup-python`.

runs:
  using: composite
  steps:
    # One command, and the same one a person runs before pushing:
    # `python3 tools/ship.py`. It builds the page, then runs the suite, the
    # dataset validation, `promote --check` and the seed check in parallel
    # across the test modules -- 24 seconds against about 60 serially, on all
    # five callers of this action.
    #
    # Delegating rather than listing the steps here is what makes "the same
    # bar" true of a *developer* as well as of the five workflows. The list
    # used to live in this file, so the only way to run it was to push and
    # wait; anything a person ran locally was a different list that could
    # drift from it silently.
    #
    # In a data job this step sits after the fetch and before the commit,
    # which is the distinction #118 exists for: an assertion about committed
    # data must gate what is published and must never stop the fetch that
    # would correct it.
    #
    # `test_layout` needs a browser and skips without one, so a data job runs
    # everything else and `ci.yml`'s `layout` job -- which installs Chromium --
    # is where that half is really asserted.
    - name: The gate
      shell: bash
      run: python3 tools/ship.py
